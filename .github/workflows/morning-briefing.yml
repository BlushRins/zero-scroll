name: Morning Briefing

on:
  schedule:
    # 07:00 Asia/Manila (UTC+8) every day
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending Gmail/Discord or marking links digested'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Morning Briefing
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run brief:dry
          else
            npm run brief
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-briefing.json data/seen.json data/readlater.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update morning briefing state"
            git push
          fi
