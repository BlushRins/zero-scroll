name: Hourly Reminders

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check reminders without sending alerts'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run reminder check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run reminders:dry
          else
            npm run reminders
          fi

      - name: Commit updated reminder flags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record sent reminders"
            git push
          fi
